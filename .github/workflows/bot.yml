name: Chelsea repost bot

on:
  workflow_dispatch:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: read

concurrency:
  group: chelsea-repost-bot
  cancel-in-progress: false

jobs:
  repost:
    if: github.event_name == 'workflow_dispatch' || vars.BOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bot
        run: python -m pip install .
      - name: Restore bot checkpoint
        uses: actions/cache/restore@v5
        with:
          path: data/state.db
          key: chelsea-bot-state-${{ github.run_id }}
          restore-keys: |
            chelsea-bot-state-
      - name: Run one live cycle
        run: chelsea-bot run --live
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          SOURCE_USERNAME: FabrizioRomano
          CHELSEA_TERMS: chelsea,chelsea fc,chelseafc,@chelseafc,#chelseafc
          STATE_PATH: data/state.db
          DRY_RUN: "false"
          BOOTSTRAP_MODE: baseline
          MAX_REPOSTS_PER_RUN: "5"
      - name: Save bot checkpoint
        if: always() && hashFiles('data/state.db') != ''
        uses: actions/cache/save@v5
        with:
          path: data/state.db
          key: chelsea-bot-state-${{ github.run_id }}
