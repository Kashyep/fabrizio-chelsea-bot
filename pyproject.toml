[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fabrizio-chelsea-bot"
version = "1.0.0"
description = "Repost only Fabrizio Romano posts that mention Chelsea."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kashyep" }]
dependencies = [
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "requests-oauthlib>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.11,<1",
]
pdf = [
  "reportlab>=4.2,<6",
  "pypdf>=5,<7",
]

[project.scripts]
chelsea-bot = "chelsea_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chelsea_bot"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
